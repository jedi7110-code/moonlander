<body>
  <header>
    <h1>LOUNGE / SMOKING STUDY</h1>
    <nav aria-label="確認する対象">
      <button data-mode="lounge" aria-pressed="true" disabled>ラウンジの喫煙</button>
      <button data-mode="ashtray" aria-pressed="false" disabled>灰皿単体</button>
    </nav>
    <nav aria-label="視点">
      <button data-view="oblique" aria-pressed="true" disabled>斜め</button>
      <button data-view="front" aria-pressed="false" disabled>正面</button>
      <button data-view="side" aria-pressed="false" disabled>横</button>
      <button data-view="top" aria-pressed="false" disabled>上から</button>
      <button data-view="hands" aria-pressed="false" disabled>灰皿と手元</button>
      <button data-view="lighter" aria-pressed="false" disabled>ライターの握り</button>
      <button data-view="lighterBack" aria-pressed="false" disabled>ライター・反対側</button>
      <button data-view="cigarette" aria-pressed="false" disabled>煙草の握り</button>
    </nav>
  </header>
  <main>
    <canvas id="smoking-view" aria-label="灰皿とラウンジの3Dスタディー" tabindex="0"></canvas>
    <div class="hint">ドラッグで回転・右ドラッグで移動・ホイールで拡大</div>
    <div id="loading" role="status">灰皿とラウンジを読み込み中</div><div id="error" role="alert" hidden></div>
  </main>
  <footer>
    <div id="playback" class="controls">
      <button id="play" aria-pressed="false" disabled>再生</button><button id="restart" disabled>最初から</button>
      <button id="previous" aria-label="1コマ戻す" disabled>−1コマ</button><button id="next" aria-label="1コマ進む" disabled>＋1コマ</button>
      <label>速度 <select id="speed" disabled><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value="1" selected>1倍</option></select></label>
      <label><input id="loop" type="checkbox" checked disabled>繰り返す</label>
    </div>
    <strong id="phase">火をつける</strong>
    <div id="timeline"><input id="study-time" type="range" min="0" max="41.8" step=".0166667" value="11.4" aria-label="喫煙動作の時間" disabled><output id="clock"></output></div>
    <nav id="phases" aria-label="喫煙の場面" class="controls">
      <button data-phase="enter" disabled>入る</button><button data-phase="sit" disabled>座る</button><button data-phase="light" disabled>火をつける</button>
      <button data-phase="smoke" disabled>吸う</button><button data-phase="ash" disabled>灰を落とす</button><button data-phase="extinguish" disabled>火を消す</button>
      <button data-phase="stand" disabled>立ち上がる</button><button data-phase="leave" disabled>出る</button>
    </nav>
  </footer>
