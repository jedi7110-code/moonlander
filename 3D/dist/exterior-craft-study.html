<header><h1 id="name">モデルスタディー</h1><nav aria-label="機体"><a href="?craft=mothership" data-craft="mothership">母艦</a><a href="?craft=probe" data-craft="probe">小型船</a></nav><p>ドラッグで回転・ホイールで拡大・右ドラッグで移動</p></header>
<main><canvas id="view" aria-label="機体の単独3D表示"></canvas><div id="status" role="status">準備中…</div></main>
<footer><div class="row" aria-label="外装"><span id="detail-note">現行モデル / パネルの分割・段差</span><label id="panel-wear-control" hidden><input type="checkbox" id="panel-wear" checked>汚れ・傷・すす</label><label id="probe-lines-control" hidden><input type="checkbox" id="probe-lines" checked>既存のパネル線を濃く</label></div>
<div class="row" aria-label="視点"><button data-view="whole">全体</button><button data-view="front">前</button><button data-view="side">横</button><button data-view="rear">後ろ</button><button data-view="under">下</button><button data-view="antenna">アンテナ</button><button data-view="bridge" id="bridge-view">操縦区画</button><button data-view="front-windows" id="front-windows-view">正面窓</button><button data-view="skylights" id="skylights-view">天窓</button><button data-view="bow-face" id="bow-face-view">船首パネル</button><button data-view="habitat-face" id="habitat-face-view">居住区端面</button><button data-view="habitat-hatch" id="habitat-hatch-view">居住区ハッチ</button><button data-view="habitat-mount" id="habitat-mount-view">居住区の接続部</button><button data-view="habitat-mount-rear" id="habitat-mount-rear-view">接続部・裏側</button><button data-view="service-side" id="service-side-view">船首側面</button><button data-view="service-cover" id="service-cover-view">点検蓋・右</button><button data-view="service-cover-left" id="service-cover-left-view">点検蓋・左</button><button data-view="service-top" id="service-top-view">船首上面</button><button data-view="service-under" id="service-under-view">船首下面</button><button data-view="eva-hatch" id="eva-hatch-view">EVAハッチ</button><button data-view="markings">整備・警告表示</button><button data-view="nozzle" id="nozzle-view">姿勢制御ノズル</button><button data-view="foot" id="foot-view">着陸脚</button></div>
