<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OBS 船内パーツ壁面・スタディー</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111817;color:#e8e8dc;font:14px system-ui,sans-serif}
    body{display:grid;grid-template-rows:auto minmax(0,1fr)}
    header{display:flex;align-items:center;gap:16px;padding:15px 23px;border-bottom:1px solid #39433f;background:#1b2422;flex-wrap:wrap}
    .eyebrow{font:11px ui-monospace,monospace;letter-spacing:.16em;color:#a1b3a6}.title{font-size:17px;font-weight:650;letter-spacing:.04em}
    header a{margin-left:auto;color:#c5d5c3;text-decoration:none;border-bottom:1px solid #6d8275;padding-bottom:2px}
    main{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
    aside{padding:22px;overflow:auto;background:#1a2220;border-right:1px solid #39433f}
    aside h2{font-size:12px;letter-spacing:.14em;color:#a4b6a8;font-weight:600;margin:0 0 12px}
    .reference{width:100%;display:block;border:1px solid #566056;border-radius:3px;aspect-ratio:924/468;object-fit:cover}
    .caption{font-size:12px;line-height:1.65;color:#afbcb0;margin:9px 0 25px}
    .choices{display:grid;gap:8px}.choice{width:100%;text-align:left;background:#26312d;border:1px solid #495951;border-radius:5px;padding:12px 13px;color:inherit;cursor:pointer}
    .choice:hover{background:#304039}.choice[aria-pressed=true]{border-color:#c7d6b2;background:#35483b;box-shadow:inset 3px 0 #c7d6b2}
    .choice strong{display:block;font-size:14px;margin-bottom:4px}.choice span{display:block;color:#b7c5b8;font-size:12px;line-height:1.5}
    .stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;background:radial-gradient(ellipse at 50% 40%,#303c37 0%,#17211f 72%)}
    .toolbar{display:flex;gap:7px;padding:14px 16px;align-items:center;flex-wrap:wrap}
    button{font:inherit;color:#dde7d9;background:#27342f;border:1px solid #607166;border-radius:4px;padding:8px 14px;cursor:pointer}
    button:hover{background:#34463b}button[aria-pressed=true]{color:#19251e;background:#c5d4b5;border-color:#c5d4b5}button:focus-visible,a:focus-visible{outline:2px solid #d2e9c2;outline-offset:3px}
    .viewport{position:relative;min-height:380px}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
    .labels{position:absolute;left:3%;right:3%;bottom:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;pointer-events:none}
    .labels span{text-align:center;padding:8px;color:#f1f1e4;background:#19231fd9;border:1px solid #556459;font-size:12px;letter-spacing:.05em}
    .labels[hidden]{display:none}.status{position:absolute;inset:0;display:grid;place-items:center;color:#e6eadd;pointer-events:none}.status[hidden]{display:none}
    .foot{border-top:1px solid #3b4841;padding:11px 18px;color:#afbdaf;font-size:12px;line-height:1.5}
    @media(max-width:900px){main{grid-template-columns:1fr}aside{display:grid;grid-template-columns:140px 1fr;gap:8px 16px;padding:13px;border-right:0;border-bottom:1px solid #39433f}aside h2{grid-column:1/-1;margin:0}.reference{grid-row:2}.caption{grid-column:1;grid-row:3;margin:0}.choices{grid-column:2;grid-row:2/4}.viewport{min-height:390px}}
    @media(max-width:580px){header{padding:10px 13px}.title{font-size:14px}header a{margin-left:0}aside{display:block}.reference{display:none}.caption{display:none}.choices{grid-template-columns:repeat(3,minmax(0,1fr))}.choice{padding:9px}.choice strong{font-size:12px}.choice span{display:none}.viewport{min-height:320px}.labels{bottom:9px;gap:3px}.labels span{padding:5px 2px;font-size:10px}.toolbar{padding:9px}}
  </style>
  <script type="module" crossorigin src="/3D/assets/servicePartsStudy-CJAeA6UB.js"></script>
  <link rel="modulepreload" crossorigin href="/3D/assets/three-D_l1qIn7.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/BufferGeometryUtils-CVtbbMuF.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/OrbitControls-uEL6Cgr8.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/industrial-BrSHzYHX.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/service-parts-B8vkl0M9.js">
</head>
<body>
  <header><span class="eyebrow">TARAIRON / OBS / STUDY 01</span><span class="title">船内パーツ壁面の置き換え</span><a href="./obs.html">OBS船内を開く</a></header>
  <main>
    <aside>
      <h2>現在の対象</h2>
      <img class="reference" src="/3D/assets/service-parts-reference-DY8YQa3v.png" alt="現行の横長パーツのスクリーンショット">
      <p class="caption">横帯3本と大きな留め具がある壁面パーツ。各案は同じ横長の設置範囲を想定しています。</p>
      <div class="choices" aria-label="候補の説明">
        <button class="choice" type="button" data-view="cassette" aria-pressed="false"><strong>01 / 整備カセット</strong><span>壁と面一の扉。細い継ぎ目と小さな取っ手で静かに収める。</span></button>
        <button class="choice" type="button" data-view="rack" aria-pressed="false"><strong>02 / 部品収納ラック</strong><span>規格の揃った3個の密閉ケース。中身と使い方が読み取れる。</span></button>
        <button class="choice" type="button" data-view="manifold" aria-pressed="false"><strong>03 / 配管点検パネル</strong><span>配管、バルブ、保護板を見せる設備寄りの案。</span></button>
      </div>
    </aside>
    <section class="stage" aria-label="3D比較">
      <div class="toolbar" role="group" aria-label="表示する案">
        <button type="button" data-view="all" aria-pressed="true">3案を比較</button>
        <button type="button" data-view="cassette" aria-pressed="false">01</button>
        <button type="button" data-view="rack" aria-pressed="false">02</button>
        <button type="button" data-view="manifold" aria-pressed="false">03</button>
      </div>
      <div class="viewport"><canvas id="study" tabindex="0" aria-label="壁面パーツ3案の3Dスタディー。ドラッグで回転、スクロールで拡大縮小。"></canvas><div class="labels"><span>01 / 整備カセット</span><span>02 / 部品収納ラック</span><span>03 / 配管点検パネル</span></div><div class="status" role="status">読み込み中</div></div>
      <div class="foot">ドラッグで角度変更・スクロールで拡大 ／ 船内の塗装・金属素材を使用した形状スタディー。OBS本体には未反映。</div>
    </section>
  </main>
</body>
</html>
