<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>チェス駒・スタディー | TARAIRON</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#080f12;color:#d3e1df;font:13px system-ui,sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;border-bottom:1px solid #293c3e}h1{font-size:14px;letter-spacing:.15em;font-weight:500;margin:0}header small{display:block;color:#6e8c90;letter-spacing:.1em;font-size:10px;margin-top:5px}
    a{color:#9db9bc;text-decoration:none}a:hover{color:#e6ffff}a:focus-visible,button:focus-visible{outline:2px solid #98e8ee;outline-offset:4px}
    main{flex:1;min-height:0;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
    #status{position:absolute;inset:0;display:grid;place-content:center;color:#9db9bc;pointer-events:none}#status[hidden]{display:none}
    .piece-label{position:absolute;top:0;left:0;text-align:center;pointer-events:none;white-space:nowrap;font-size:11px;letter-spacing:.16em;color:#a8c3c6}.piece-label span{display:block;font-size:9px;letter-spacing:.12em;color:#58767c;margin-top:6px}
    footer{padding:15px 24px 13px;border-top:1px solid #293c3e;background:#0d171b}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.group{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
    button{font:inherit;color:#88a2a7;background:transparent;border:1px solid transparent;border-radius:3px;padding:7px 11px;cursor:pointer}button:hover{color:#e6ffff;background:#172b31}button[aria-pressed=true]{color:#d2f3f4;border-color:#426a73;background:#173038}
    .hint{margin:12px 0 0;color:#59757b;font-size:10px;letter-spacing:.04em}
    @media(max-width:640px){header{padding:13px 15px}h1{font-size:12px}header a{font-size:11px}footer{padding:10px 12px}.toolbar{gap:7px}button{padding:6px 8px;font-size:12px}.hint{margin-top:8px}}
  </style>
  <script type="module" crossorigin src="/3D/assets/chessPieceStudy-CAU0iurm.js"></script>
  <link rel="modulepreload" crossorigin href="/3D/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/three-Bv-IqvwR.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/OrbitControls-D11TJj5P.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/OutputPass-DlwBg9nR.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/BufferGeometryUtils-DmVUQhO0.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/RoundedBoxGeometry-DeoG94X3.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/chess-geometry-j1dHrbHw.js">
  <link rel="modulepreload" crossorigin href="/3D/assets/chess-hologram-Cj6Tl2hN.js">
</head>
<body>
  <header><div><h1>CHESS / PIECE STUDY</h1><small>KING · KNIGHT · PAWN</small></div><a href="./lounge-games-study.html?game=chess">チェス盤へ ↗</a></header>
  <main id="stage">
    <canvas id="pieces" tabindex="0" aria-label="キング・ナイト・ポーンの3Dスタディー。ドラッグで回転、ホイールで拡大、右ドラッグで移動。"></canvas>
    <div id="status" role="status">読み込み中</div>
    <div class="piece-label" data-label="k">キング<span>KING</span></div>
    <div class="piece-label" data-label="n">ナイト<span>KNIGHT</span></div>
    <div class="piece-label" data-label="p">ポーン<span>PAWN</span></div>
  </main>
  <footer>
    <div class="toolbar">
      <nav class="group" aria-label="確認する駒"><button data-piece="all" aria-pressed="true">3体</button><button data-piece="k" aria-pressed="false">キング</button><button data-piece="n" aria-pressed="false">ナイト</button><button data-piece="p" aria-pressed="false">ポーン</button></nav>
      <nav class="group" aria-label="視点"><button data-view="front" aria-pressed="false">正面</button><button data-view="back" aria-pressed="false">背面</button><button data-view="side" aria-pressed="false">横</button><button data-view="oblique" aria-pressed="true">斜め</button></nav>
      <nav class="group" aria-label="質感"><button data-material="hologram" aria-pressed="true">投影</button><button data-material="solid" aria-pressed="false">形状</button></nav>
    </div>
    <p class="hint">ドラッグ：回転　ホイール：拡大　右ドラッグ：移動　ダブルクリック：3体に戻る</p>
  </footer>
</body>
</html>
