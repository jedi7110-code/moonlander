<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>母艦・小型船 / 単独モデルスタディー</title><link rel="stylesheet" href="./exterior-craft-study.css"></head><body>
<header><h1 id="name">モデルスタディー</h1><nav aria-label="機体"><a href="?craft=mothership" data-craft="mothership">母艦</a><a href="?craft=probe" data-craft="probe">小型船</a></nav><p>ドラッグで回転・ホイールで拡大・右ドラッグで移動</p></header>
<main><canvas id="view" aria-label="機体の単独3D表示"></canvas><div id="status" role="status">準備中…</div></main>
<footer><div class="row" aria-label="視点"><button data-view="whole">全体</button><button data-view="front">前</button><button data-view="side">横</button><button data-view="rear">後ろ</button><button data-view="under">下</button><button data-view="antenna">アンテナ</button><button data-view="bridge" id="bridge-view">操縦区画</button><button data-view="markings">整備・警告表示</button><button data-view="nozzle" id="nozzle-view">姿勢制御ノズル</button><button data-view="foot" id="foot-view">着陸脚</button></div>
<div class="row"><label>背景 <select id="background"><option value="#58636b">グレー</option><option value="#c6ccd0">明るいグレー</option><option value="#242b31">暗いグレー</option><option value="#000000">宇宙・黒</option></select></label><label>照明 <select id="lighting"><option value="studio">スタディー</option><option value="space">オープニング本番</option></select></label><label id="gas-control"><input type="checkbox" id="gas">ガス噴射を表示</label><label id="nozzle-bounce-control"><input type="checkbox" id="nozzle-bounce" checked>内壁の青白い照り返し</label><label><input type="checkbox" id="wire">ワイヤー表示</label><button id="reset">視点を戻す</button></div>
<p id="note"></p></footer><script type="module" src="./exterior-craft-study.js"></script></body></html>
