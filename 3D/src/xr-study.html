<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Quest 2 描画設定の比較</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#090d0f;color:#e0e6df;font:14px system-ui}
    header{padding:14px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}h1{font-size:16px;margin:0}
    button,select{padding:8px;background:#24383a;color:inherit;border:1px solid #648479;border-radius:6px}
    main{height:calc(100vh - 120px);min-height:350px}canvas{display:block;width:100%;height:100%}
    footer{padding:12px 20px;color:#a6b5b2}output{font-variant-numeric:tabular-nums}
  </style>
</head>
<body>
  <header><h1>Quest 2 描画設定の比較</h1>
    <label>描画 <select id="quality"><option value="desktop">通常</option><option value="vr" selected>VR軽量設定</option></select></label>
    <label>視点 <select id="focus"><option value="all">全景</option><option value="milo">マイロ</option><option value="cat">ルーシー</option><option value="droid">ドロイド</option></select></label>
    <output id="stats">読み込み中…</output>
  </header>
  <main><canvas id="scene"></canvas></main>
  <footer>デスクトップ上の片眼相当の比較です。Quest実機のFPSは測定していません。ドラッグ・ホイールで移動できます。</footer>
  <script type="module" src="./obs/xr-study.js"></script>
</body>
</html>
