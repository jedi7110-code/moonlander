<!doctype html><html lang="ja"><meta charset="utf-8"><title>Milo・シャワー横で一服</title>
<style>body{margin:0;background:#151d1c;color:#e3e2d5;font:14px system-ui}header{min-height:62px;box-sizing:border-box;padding:10px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px}button,select{padding:8px 12px;background:#303d38;border:1px solid #84927c;color:inherit;border-radius:4px}canvas{display:block;width:100vw;height:calc(100vh - 110px)}footer{height:48px;display:flex;align-items:center;gap:12px;padding:0 16px;box-sizing:border-box}input{flex:1}output{min-width:180px}</style>
<header><b>シャワー横で一服</b><button id="play">再生</button><button id="restart">最初から</button><button data-time="9.35">点火</button><button data-time="15.8">吸う</button><button data-time="18.5">煙を吐く</button><button data-time="29.5">火を消す</button><button id="leave">切り上げる</button><select id="camera" aria-label="見え方"><option value="wide">船内で確認</option><option value="hands">手元を見る</option></select></header>
<canvas></canvas><footer><input id="time" aria-label="動作の時間" type="range" min="0" max="38.2" step="0.05" value="15.8"><output id="status">読み込み中</output></footer>
<script type="module" src="./smoking-check.js"></script></html>
