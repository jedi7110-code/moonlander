<body><main><h1>廊下の窓 / 浅い角度の比較</h1><p>OBSと同じ船内・窓。窓を見ながら廊下の左右へ移動します。窓枠による遮蔽はそのまま、見えている開口部の宇宙は途切れません。</p>
<canvas id="window-view" aria-label="廊下から窓の外を見る"></canvas>
<nav><button id="fixed" aria-pressed="true">軽量版：見える範囲だけ</button><button id="full" aria-pressed="false">軽量化前：星6,000個</button><button id="legacy" aria-pressed="false">初期：背景の板</button><button id="measure">処理時間を比較</button><button id="front">正面</button><button id="left">左から −65°</button><button id="right">右から +65°</button><button id="walk">左右に歩く</button></nav>
<nav><label>見る角度 <input id="angle" type="range" min="-75" max="75" step="1" value="65"></label><label>階 <select id="deck"><option value="0">OPERATIONS</option><option value="1" selected>HABITATION</option><option value="2">LIFE SUPPORT</option></select></label><label>窓 <select id="window"><option value="2">左端</option><option value="5">左中</option><option value="8" selected>中央</option><option value="11">右中</option><option value="14">右端</option></select></label></nav>
<nav><label>距離 <select id="distance"><option value="0.78" selected>通路を歩く位置</option><option value="2.35">窓に寄って確認</option></select></label></nav>
<p id="status" role="status">読み込み中…</p><pre id="metrics" style="white-space:pre-wrap"></pre><a href="http://localhost:4199/3D/obs.html">OBSへ戻る</a></main>
