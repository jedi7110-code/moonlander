<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>マイロ・スタディー</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#5d6263;color:#f4f3ed;font:14px system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;top:16px;left:18px;right:18px;pointer-events:none}h1{font-size:18px;margin:0 0 8px;letter-spacing:0}nav{display:flex;gap:6px;flex-wrap:wrap}button,select{pointer-events:auto;font:inherit;background:#343a3b;color:inherit;border:1px solid #8b9292;border-radius:6px;padding:7px 11px;cursor:pointer}button[aria-pressed=true]{background:#eeeae0;color:#242a2d}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #f4ce7e;outline-offset:3px}#status{display:block;font-size:12px;margin-top:8px;opacity:.84}#error{color:#ffd7b0}footer{position:absolute;bottom:18px;left:18px;right:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#303638dc;border-radius:8px;padding:12px}label{display:flex;gap:6px;align-items:center;font-size:12px}input[type=range]{width:min(32vw,320px);accent-color:#d4bd7f}#help{font-size:11px;opacity:.8}
</style>
<canvas aria-label="マイロの衣服と姿勢を確認する3Dビュー"></canvas>
<header><h1>マイロ・スタディー</h1><nav id="poses" aria-label="確認姿勢"></nav><span id="status" role="status">モデルを読み込み中...</span><span id="error" role="alert"></span></header>
<footer><button id="pause">一時停止</button><button id="restart">最初から</button><label>速度<select id="speed"><option value=".25">0.25倍</option><option value=".5">0.5倍</option><option value="1" selected>1倍</option></select></label><label>時間<input id="time" aria-label="再生位置" type="range" min="0" max="8" step=".01" value="0"></label><output id="clock">0.00秒</output><select id="view" aria-label="視点"><option value="oblique">斜め</option><option value="front">正面</option><option value="back">背面</option><option value="left">左側</option><option value="right">右側</option><option value="trousers">ズボン拡大</option></select><button id="reset">視点を戻す</button><span id="help">ドラッグ：回転 ／ ホイール：拡大縮小 ／ 右ドラッグ：移動</span></footer>
