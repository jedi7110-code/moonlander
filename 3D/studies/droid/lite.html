<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3817 — ドロイド軽量化 比較スタディ</title>
  <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./lite.css">
  <script type="importmap">{"imports":{"three":"/3D/node_modules/three/build/three.module.js","three/addons/":"/3D/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
  <main>
    <section class="viewport" aria-label="詳細版ドロイドと軽量ドロイドの比較">
      <canvas id="droid-canvas" aria-label="両モデルを同時に回転・拡大"></canvas>
      <header><span class="eyebrow">3817 / OPTIMIZATION STUDY</span><h1>ドロイド 比較スタディ</h1><p>同じ照明・同じ姿勢で比較</p></header>
      <div id="panel-labels"><div data-panel="study"><b>詳細版</b><span id="study-triangles"></span></div><div data-panel="obs"><b>軽量版</b><span id="obs-triangles"></span></div></div>
      <div id="divider"></div>
      <div id="draw-counts"><span data-panel="study" id="study-calls"></span><span data-panel="obs" id="obs-calls"></span></div>
      <div class="view-label"><span id="view-label">THREE-QUARTER</span><span>ドラッグで回転 · スクロールで拡大</span></div>
      <div id="loading" role="status">比較モデルを組み立てています…</div><div id="error" role="alert" hidden></div>
    </section>
    <aside>
      <div class="identity"><span class="eyebrow">DETAIL / LIGHTWEIGHT</span><p class="study-notice">比較用スタディ<br>OBS本体は軽量版を使用</p><p id="reduction"></p></div>
      <section class="control-section"><h2><span>01</span> 比較表示</h2><div class="segmented"><button data-layout="both" aria-pressed="true">左右比較</button><button data-layout="study" aria-pressed="false">詳細のみ</button><button data-layout="obs" aria-pressed="false">軽量のみ</button></div></section>
      <section class="control-section"><h2><span>02</span> 動作</h2><div class="segmented views"><button data-mode="idle" aria-pressed="true">待機</button><button data-mode="walk" aria-pressed="false">歩行</button><button data-mode="climb" aria-pressed="false">ハシゴ</button><button data-mode="carry" aria-pressed="false">配膳</button><button data-mode="charging" aria-pressed="false">充電休止</button><button data-mode="wake" aria-pressed="false">起動</button></div></section>
      <section class="control-section"><h2><span>03</span> 表情</h2><div class="segmented views"><button data-expression="neutral" aria-pressed="true">通常</button><button data-expression="happy" aria-pressed="false">喜び</button><button data-expression="sad" aria-pressed="false">悲しみ</button><button data-expression="surprised" aria-pressed="false">驚き</button><button data-expression="angry" aria-pressed="false">怒り</button><button data-expression="sleepy" aria-pressed="false">眠い</button></div></section>
      <section class="control-section"><h2><span>04</span> 視点</h2><div class="segmented views"><button data-view="three" aria-pressed="true">斜め</button><button data-view="front" aria-pressed="false">正面</button><button data-view="side" aria-pressed="false">横</button><button data-view="back" aria-pressed="false">背面</button><button data-view="head" aria-pressed="false">顔</button><button data-view="hands" aria-pressed="false">手元</button></div></section>
      <section class="control-section"><h2><span>05</span> 表面</h2><div class="segmented"><button data-style="current" aria-pressed="false">金属</button><button data-style="cartoon" aria-pressed="true">トゥーン</button><button data-style="flat" aria-pressed="false">線なし</button></div></section>
      <section class="playback"><div class="playback-heading"><button id="play" aria-pressed="false">再生</button><output id="time-output" for="time">0.0 s</output></div><input id="time" aria-label="動作の時間" type="range" min="0" max="20" value="0" step="0.01"><div class="playback-foot"><button id="reset">最初から</button><label>速度 <select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option></select></label></div></section>
      <p class="metric-note">三角形数：非表示の表情・トレーを含むモデル総数。輪郭線は除外。<br>描画回数：表示中の本体＋輪郭線。影は除外。</p>
      <footer>LIGHTWEIGHT STUDY <span>角材の機構 · 傷とビスの画像 · ニキシー画像</span></footer>
    </aside>
  </main>
  <script type="module" src="./lite-study.js"></script>
</body>
</html>
