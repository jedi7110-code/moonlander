<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>宇宙服スタディー | TARAIRON</title>
  <link rel="stylesheet" href="/3D/studies/eva/study.css">
  <script type="importmap">{"imports":{"three":"/3D/node_modules/three/build/three.module.js","three/addons/":"/3D/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
  <header>
    <div><p class="eyebrow">TARAIRON / EVA STUDY</p><h1>宇宙服スタディー</h1></div>
    <p class="source">本編と共通のモデル<br><span>装甲パネル / スモークバイザー</span></p>
  </header>
  <main>
    <section class="viewer" aria-label="宇宙服の形状確認">
      <canvas tabindex="0" aria-label="宇宙服の3Dビュー。ドラッグで回転、ホイールで拡大縮小"></canvas>
      <div class="view-label"><span id="view-label">全身 / 斜め</span><span id="source-label">読み込み中</span></div>
      <div id="loading" role="status">本編の宇宙服を読み込み中…</div>
      <p id="error" role="alert" hidden></p>
      <p class="help">ドラッグ：回転　ホイール：拡大縮小　右ドラッグ：移動</p>
    </section>
    <aside aria-label="表示設定">
      <fieldset><legend>宇宙服</legend><div class="buttons" id="suits">
        <button data-suit="white" aria-pressed="true">白 / EVA-01</button>
        <button data-suit="red" aria-pressed="false">赤 / EVA-02</button>
        <button data-suit="all" aria-pressed="false">3着を並べる</button>
      </div></fieldset>
      <fieldset><legend>確認する部分</legend><div class="buttons" id="focuses">
        <button data-focus="body" aria-pressed="true">全身</button>
        <button data-focus="helmet" aria-pressed="false">ヘルメット・首</button>
        <button data-focus="gloves" aria-pressed="false">手袋・手首</button>
        <button data-focus="boots" aria-pressed="false">ブーツ</button>
        <button data-focus="backpack" aria-pressed="false">背面装置</button>
      </div></fieldset>
      <fieldset><legend>視点</legend><div class="buttons views" id="views">
        <button data-view="oblique" aria-pressed="true">斜め</button>
        <button data-view="front" aria-pressed="false">正面</button>
        <button data-view="back" aria-pressed="false">背面</button>
        <button data-view="left" aria-pressed="false">左側</button>
        <button data-view="right" aria-pressed="false">右側</button>
      </div></fieldset>
      <fieldset><legend>表示</legend>
        <label><input id="wireframe" type="checkbox">ワイヤーフレーム</label>
        <label><input id="hanger" type="checkbox">吊り具を表示</label>
        <label><input id="rotate" type="checkbox">自動回転</label>
        <label class="lighting">照明<select id="light"><option value="studio">形状確認用</option><option value="warm">暖色・暗め</option></select></label>
      </fieldset>
      <div class="zoom"><button id="zoom-out" aria-label="縮小">−</button><button id="reset">視点を戻す</button><button id="zoom-in" aria-label="拡大">＋</button></div>
      <p id="status" role="status" aria-live="polite">準備中</p>
      <p class="note">金属のバイザー固定枠、側面ロック、背面パネルと2本の呼吸ホース。ガラスの内側にはクッション内装を配置。本編と同じ部品を表示しています。</p>
    </aside>
  </main>
  <script type="module" src="/3D/studies/eva/study.js"></script>
</body>
</html>
