<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TARAIRON / 船体外観ムービー</title><link rel="stylesheet" href="./ship-exterior-cinema.css">
<style>html,body{margin:0;background:#030609}#space-boot{position:fixed;inset:0;z-index:10;background:#030609;pointer-events:none}#space-boot-sky{width:100%;height:100%}</style></head>
<body data-space-scene="film" class="waiting-for-film"><main><canvas id="exterior-view" aria-label="航行する宇宙船の自動画角"></canvas><div class="letterbox top"></div><div class="letterbox bottom"></div>
<div id="space-boot" aria-hidden="true"><canvas id="space-boot-sky"></canvas></div>
<div id="scene-number" aria-label="シーン番号" hidden>SCENE 01</div>
<div id="status" role="status" hidden></div><div class="identity" role="img" aria-label="TARAIRON"><div class="logo-wordmark"><div class="logo-reveal">
<img class="logo-image" src="/assets/obs/tarairon-wordmark.svg" alt="" aria-hidden="true" width="1417" height="120">
</div></div></div>
<nav id="cinema-controls" aria-label="外観映像の操作" hidden><button id="play" aria-pressed="true">一時停止</button><button id="restart">最初から</button><a id="cabin" href="./obs.html?opening=0">船内へ</a><input id="timeline" type="range" min="0" max="146.75" step=".01" value="0" aria-label="映像の位置"><output id="time"></output></nav></main>
<script type="module" src="/assets/obs/exterior-loading.js"></script>
<script type="module" src="./ship-exterior-cinema.js"></script></body></html>
