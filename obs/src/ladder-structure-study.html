<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ハシゴ構造スタディー | TARAIRON</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;background:#101719;color:#e0e6de;font:13px system-ui,sans-serif}
    header{padding:13px 18px;border-bottom:1px solid #394842;display:flex;align-items:center;justify-content:space-between;gap:18px}h1{font-size:17px;font-weight:550;margin:0}header p{margin:5px 0 0;color:#a7b8ae;font-size:12px;line-height:1.5}a{color:#c9d2b4;white-space:nowrap;text-underline-offset:4px}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:11px 18px;border-bottom:1px solid #394842;background:#1b2422}nav{display:flex;gap:5px;flex-wrap:wrap}button,select{font:inherit;color:inherit;background:#293632;border:1px solid #52615a;border-radius:4px;padding:8px 11px;cursor:pointer}button[aria-pressed=true]{background:#47503c;border-color:#c5cc9a}button:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid #e4ce86;outline-offset:3px}.toolbar label{display:flex;gap:7px;align-items:center;font-size:12px}input{accent-color:#c5cc9a}select{max-width:160px}
    main{position:relative;flex:1;min-height:260px}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}#status{position:absolute;inset:0;background:#101719;display:grid;place-items:center;color:#bdc9bc}#status[hidden]{display:none}.view-note{position:absolute;left:18px;top:14px;padding:6px 9px;background:#101719d9;border:1px solid #43524a;font-size:12px;pointer-events:none}.hint{position:absolute;bottom:14px;left:18px;font-size:11px;color:#b7c3b6;pointer-events:none;background:#101719bf;padding:5px 8px;margin:0}
    footer{display:flex;gap:18px;justify-content:space-between;flex-wrap:wrap;padding:10px 18px;border-top:1px solid #394842;font-size:11px;color:#a4b3a9;line-height:1.5}#dimensions{font-variant-numeric:tabular-nums}
    @media(max-width:650px){header{padding:12px}h1{font-size:15px}header a{font-size:11px}.toolbar{gap:9px;padding:10px 12px}button,select{padding:7px 9px;font-size:12px}.hint{font-size:10px;left:12px}.view-note{left:12px}footer{padding:8px 12px;gap:3px}}
  </style>
</head>
<body>
  <header><div><h1>ハシゴの構造</h1><p>現在のOBSモデルを、床・天井・後壁との位置関係で確認。</p></div><a href="./obs.html">OBSへ戻る ↗</a></header>
  <div class="toolbar">
    <nav aria-label="視点"><button data-view="angle" aria-pressed="true">斜め</button><button data-view="front" aria-pressed="false">正面</button><button data-view="side" aria-pressed="false">側面</button><button data-view="back" aria-pressed="false">背面</button><button data-view="top" aria-pressed="false">上から</button></nav>
    <select id="focus" aria-label="確認する範囲"><option value="all">ハシゴ全体</option><option value="0">LEVEL 1</option><option value="1">LEVEL 2</option><option value="2">LEVEL 3</option><option value="roof">天井より上</option></select>
    <label><input type="checkbox" id="isolated">ハシゴ単体</label>
    <label><input type="checkbox" id="cut-wall" checked>後壁を切り欠く</label>
  </div>
  <main><canvas id="ladder-view" tabindex="0" aria-label="ハシゴと床・天井の3Dビュー"></canvas><span class="view-note" id="view-name">斜め / ハシゴ全体</span><p class="hint">ドラッグで回転 · 右ドラッグで移動 · ホイールで拡大</p><div id="status" role="status">船内の構造を準備しています…</div></main>
  <footer><span id="dimensions"></span><span>LEVEL表記はハシゴ前の床へ印刷。後壁の切り欠きは確認用です。</span></footer>
  <script type="module" src="./ladder-structure-study.js"></script>
</body>
</html>
