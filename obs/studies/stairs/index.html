<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>左側階段室 / 人・ロボ・猫</title>
<link rel="stylesheet" href="../droid/style.css"><link rel="stylesheet" href="./style.css">
<script type="importmap">{"imports":{"three":"/obs/node_modules/three/build/three.module.js","three/addons/":"/obs/node_modules/three/examples/jsm/"}}</script></head>
<body><main><section class="viewport"><canvas id="view" aria-label="船内左側に増設した階段を人間・ロボ・猫が通る3Dスタディー"></canvas><header><span class="eyebrow">STAIR TOWER / STUDY</span><h1>左側の階段室</h1></header><div class="corner"><span id="state">読み込み中</span></div><div id="loading">船内と3人を準備しています…</div></section>
<aside><div class="identity"><span class="eyebrow">CABIN CIRCULATION</span><div class="serial">STAIRS</div><p>3フロアをつなぐ折り返し階段。<br>人・ロボ・猫の共用案です。</p></div>
<section class="control-section"><h2>再生</h2><div class="actions"><button id="play">一時停止</button><button id="restart">最初から</button><button id="reverse">上下を反転して再生</button></div><input id="time" type="range" min="0" max="100" step=".05" value="0" aria-label="階段の通行時間"><output id="clock"></output></section>
<section class="control-section"><h2>表示</h2><div class="actions"><button data-view="stairs">階段室を正面から</button><button data-view="angle">斜めから</button><button data-view="whole">船内全体</button><button data-view="human">人間を追う</button><button data-view="robot">ロボを追う</button><button data-view="cat">猫を追う</button></div></section>
<section class="control-section"><h2>猫の動き</h2><div class="actions"><button data-cat-pass="up">上りを見る</button><button data-cat-pass="down">下りを見る</button></div><label>再生速度 <select id="rate"><option value="1">通常</option><option value=".5">ゆっくり（½）</option></select></label></section>
<section class="control-section"><h2>通行</h2><label><input id="human" type="checkbox" checked> マイロ</label><label><input id="robot" type="checkbox" checked> ロボ</label><label><input id="cat" type="checkbox" checked> ルーシー</label><label><input id="cargo" type="checkbox" checked> ロボに荷物を持たせる</label><label><input id="contacts" type="checkbox"> 足の接地点を表示</label></section>
<section class="control-section"><h2>寸法</h2><p>有効幅 1.40 m<br>段差 16.96 cm / 踏面 29 cm<br>各階 10段＋踊り場＋10段<br>両側手すり・足元の立ち上がり付き</p></section>
<p class="note">入口は前側の通路につなぎます。中央のハシゴは非常用として残しています。本編へ切り替える前の配置・通行確認です。</p></aside></main><script type="module" src="./study.js"></script></body></html>
